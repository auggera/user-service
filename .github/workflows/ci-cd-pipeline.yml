name: Feature Branch CI

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package
        continue-on-error: true

      - name: Run tests
        run: mvn test
        continue-on-error: true

      - name: Get Commit List
        run: |
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ];
          then
            git log --oneline ${{ github.event.before }}..${{ github.sha }} | head -n 10 > commits.txt
          else
            git log --oneline HEAD~10..HEAD > commits.txt
          fi
      

      - name: Notify Discord - Pull Request Opened
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'opened' }}
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "📋 New Pull Request Opened",
                   "description": "**Title:** ${{ github.event.pull_request.title }}\n**Author:** @${{ github.event.pull_request.user.login }}\n**Branch:** ${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}\n[View Pull Request](${{ github.event.pull_request.html_url }})",
                   "color": 3447003
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL_PR }}

      - name: Notify Discord - Pull Request Updated
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' }}
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "✏️ Pull Request Updated",
                   "description": "**Title:** ${{ github.event.pull_request.title }}\n**Author:** @${{ github.event.pull_request.user.login }}\n**Branch:** ${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}\n[View Pull Request](${{ github.event.pull_request.html_url }})",
                   "color": 16776960
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL_PR }}

      - name: Notify Discord - Success
        if: success()
        run: |
          COMMITS=$(cat commits.txt | head -n 10 | sed ':a;N;$!ba;s/\n/\\n/g')
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "✅ Build and Test Succeeded",
                   "description": "**Branch:** ${{ github.ref_name }}\n**Event**: ${{ github.event_name }}\n**Commits:**\n'"${COMMITS}"'\n**Author:** ${{ github.actor }}\n**Job:** Default CI Pipeline\n[View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                   "color": 3066993
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL_USER_SERVICE }}

      - name: Notify Discord - Failure
        if: failure()
        run: |
          COMMITS=$(cat commits.txt | head -n 10 | sed ':a;N;$!ba;s/\n/\\n/g')
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "❌ Build or Test Failed",
                   "description": "**Branch:** ${{ github.ref_name }}\n**Event**: ${{ github.event_name }}\n**Commits:**\n'"${COMMITS}"'\n**Author:** ${{ github.actor }}\n**Job:** Default CI Pipeline\n**Error:** Check logs for details.\n[View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                   "color": 15158332
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL_USER_SERVICE }}