name: Feature Branch CI

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package
        continue-on-error: true

      - name: Run tests
        run: mvn test

      - name: Run Security Scan
        run: |
          mvn org.owasp:dependency-check-maven:check || echo "Vulnerabilities detected"
          mvn org.owasp:dependency-check-maven:aggregate

      - name: Notify Discord - Security Issues
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "⚠️ Security Vulnerabilities Found",
                   "description": "**Branch:** ${{ github.ref_name }}\n**Commit:** ${{ github.sha }}\nCheck security scan logs for details.",
                   "color": 16711680
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL_USER_SERVICE }}