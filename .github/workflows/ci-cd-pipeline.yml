name: Feature Branch CI

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package
        continue-on-error: true

      - name: Run tests
        run: mvn test
        continue-on-error: true

      - name: Notify Discord - Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "✅ Build and Test Succeeded",
                   "description": "**Branch:** ${{ github.ref_name }}\n**Commit:** ${{ github.event.head_commit.message }}\n**Job:** Default CI Pipeline",
                   "color": 3066993
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL_USER_SERVICE }}

      - name: Notify Discord - Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "❌ Build or Test Failed",
                   "description": "**Branch:** ${{ github.ref_name }}\n**Commit:** ${{ github.event.head_commit.message }}\n**Error:** Check logs for details.\n**Job:** Default CI Pipeline",
                   "color": 15158332
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL_USER_SERVICE }}